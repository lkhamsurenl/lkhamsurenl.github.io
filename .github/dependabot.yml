# Monthly, one grouped PR per ecosystem, so updates arrive without much noise.
# Each PR runs the site build and link check before you merge it.
version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    groups:
      gems:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
