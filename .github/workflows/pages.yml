name: Build and deploy site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The homepage shows the latest from /books/ and /restaurant/, which deploy
  # from their own repos; rebuild daily so it picks up their changes.
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish, but don't queue more than one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          # Version comes from .ruby-version.
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v6

      # A section whose feed is missing is left off the homepage, so a failed
      # download degrades the page rather than breaking the build.
      - name: Fetch recent books and restaurants
        run: |
          mkdir -p _data/recent
          curl -fsSL https://lkhamsurenl.github.io/books/recent.json -o _data/recent/books.json \
            || { echo "::warning::books feed unavailable"; rm -f _data/recent/books.json; }
          curl -fsSL https://lkhamsurenl.github.io/restaurant/recent.json -o _data/recent/restaurants.json \
            || { echo "::warning::restaurant feed unavailable"; rm -f _data/recent/restaurants.json; }

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Checks a copy with the live /books/ and /restaurant/ pages alongside, so
      # links into them (like /books/#the-elements-of-style) are checked too
      # without being published from here. External links are skipped: other
      # people's sites going down shouldn't block a deploy.
      - name: Check links
        run: |
          check="$RUNNER_TEMP/site"
          cp -R _site "$check"
          for section in books restaurant; do
            mkdir -p "$check/$section"
            curl -fsSL "https://lkhamsurenl.github.io/$section/" -o "$check/$section/index.html"
          done
          bundle exec htmlproofer "$check" --disable-external \
            --ignore-files "/\/(books|restaurant)\//"

      - uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
