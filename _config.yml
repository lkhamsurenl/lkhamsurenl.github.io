# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: lkhamsurenl
email:
# Shown in search results, link previews and the feed.
description: lkhamsurenl personal blog with writings, books, and food
github_username: lkhamsurenl
minimal_mistakes_skin: default
# Default link-preview image for pages without their own.
og_image: /assets/images/og-default.png

# Build settings
markdown: kramdown
# Silence deprecation warnings from the theme's Sass.
sass:
  quiet_deps: true
  silence_deprecations: [import, global-builtin, if-function, slash-div, color-functions]
theme: minimal-mistakes-jekyll
# Outputting
permalink: /:categories/:title/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

url: "https://lkhamsurenl.github.io"
repository: "lkhamsurenl/lkhamsurenl.github.io"

# Exclude from processing.
# This list overrides Jekyll's defaults, so they are repeated here.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - convert.py
  - assets/notebooks/

# Plugins (previously gems:)
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

author:
  name   : "Luvsandondov Lkhamsuren"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : ""
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.lkhamsurenl.com/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lkhamsurenl"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lkhamsurenl"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      related: true
      show_date: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
